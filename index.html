<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Only For Mine ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;background:radial-gradient(circle,#761b3c,#16050c 75%);overflow:hidden;color:#4b1025}
.floating{position:fixed;font-size:30px;opacity:.7;animation:float 5s ease-in-out infinite;pointer-events:none}
.f1{left:8%;top:18%}.f2{right:10%;top:24%;animation-delay:1s}.f3{left:15%;bottom:15%;animation-delay:2s}.f4{right:14%;bottom:18%;animation-delay:3s}
@keyframes float{50%{transform:translateY(-30px) rotate(12deg)}}
.box{width:min(90%,520px);padding:45px 30px;text-align:center;background:rgba(255,240,246,.97);border:2px solid #ff83aa;border-radius:30px;box-shadow:0 0 35px #ff477e}
.big{font-size:58px;animation:beat 1.2s infinite}
@keyframes beat{50%{transform:scale(1.18)}}
h1{font-size:40px;color:#9d1740;margin:15px 0}
p{line-height:1.7}
input{width:90%;padding:15px;border:2px solid #ff8cad;border-radius:30px;text-align:center;font-size:18px;outline:none}
.hint{font-size:15px;color:#a51d48;font-style:italic}
button,.btn{display:inline-block;margin-top:18px;padding:14px 42px;border:0;border-radius:30px;background:linear-gradient(45deg,#d4144e,#ff5c86);color:#fff;font-size:18px;font-weight:bold;text-decoration:none;cursor:pointer;box-shadow:0 8px 20px #b0003c66}
#error{display:none;color:#c4144d;font-weight:bold}
</style>
</head>
<body>
<div class="floating f1">❤️</div><div class="floating f2">💕</div><div class="floating f3">💗</div><div class="floating f4">❤️</div>
<div class="box">
<div class="big">❤️</div>
<h1>ONLY FOR MINE</h1>
<p>A little place made specially for you... 💕</p>
<p>🔐 Enter the secret password</p>
<input id="password" type="password" placeholder="Enter password">
<div class="hint">💡 Hint: Password — en aaloda per 👀❤️</div>
<button onclick="checkPassword()">ENTER ❤️</button>
<p id="error">Wrong password... try again 💔</p>
</div>
<script>
function checkPassword(){
  if(document.getElementById("password").value.trim().toUpperCase()==="YUVASRI"){
    sessionStorage.setItem("unlocked","yes");
    location.href="lovee.html";
  }else document.getElementById("error").style.display="block";
}
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")checkPassword()});
</script>
</body>
</html>
